# TikTok to YouTube Channel Pairs

channels:
  - id: channel_1
    # TikTok handle changed 2026-07-25 (old @101aguafrescas account is gone).
    tiktok_username: "101nightmarketlosangeles"
    youtube_channel_name: "101aguafrescas"
    # No fixed title — use the TikTok caption, else fall back to name + upload date.
    google_credentials_file: "credentials/channel_1_client_secret.json"
    oauth_token_file: "tokens/channel_1_token.json"
    videos_per_day: 2
    description_footer: ""
    default_tags:
      - aguafrescas
      - viral
      - trending
    youtube_category_id: "22"
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: popular_split
    # Slot 1 = newest short, Slot 2 = most-viewed short. Photo/slideshow posts are
    # ignored automatically (dropped at fetch + audio-only download skipped).
    # Higher candidate budget so the popular slot can skip past viral photo posts.
    max_download_candidates: 20
    slot_publish_times_utc:
      1: "15:00"   # PUBLIC at 8 PM PKT (UTC+5)
      2: "17:00"   # PUBLIC at 10 PM PKT (UTC+5)
